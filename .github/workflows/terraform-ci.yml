name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-validate:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-terraform-sa@my-project-77-511616.iam.gserviceaccount.com

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      
      - name: Terraform Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: us-central1
          TF_VAR_composer_image_version: ${{ vars.TF_VAR_COMPOSER_IMAGE_VERSION }}
          TF_VAR_composer_service_account: ${{ vars.TF_VAR_COMPOSER_SERVICE_ACCOUNT }}
        run: terraform plan -input=false -no-color

